<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can We Keep Earth's Orbit Safe? | Space Debris</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    :root {
      --navy: #10243a;
      --blue: #1769aa;
      --light: #f2f6fa;
      --text: #253447;
      --muted: #64748b;
      --border: #d7e0e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--light);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 38px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 auto 10px;
      max-width: 850px;
      line-height: 1.25;
    }

    header p {
      margin: 0;
      color: #d6e5f5;
    }

    nav {
      background: #ffffff;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      display: inline-block;
      margin: 4px 10px;
      color: var(--blue);
      text-decoration: none;
      font-weight: bold;
    }

    main {
      width: min(100% - 32px, 950px);
      margin: 28px auto;
    }

    article, .panel {
      background: white;
      padding: 28px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    h2, h3 {
      color: var(--navy);
      line-height: 1.35;
    }

    h2 {
      border-bottom: 2px solid #e4edf5;
      padding-bottom: 8px;
      margin-top: 32px;
    }

    .abstract {
      background: #edf5fc;
      padding: 18px;
      border-left: 4px solid var(--blue);
      border-radius: 4px;
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    figure {
      margin: 22px 0;
      padding: 16px;
      background: #fbfdff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    figure img {
      max-width: 100%;
    }

    figcaption {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .chart {
      width: 100%;
      min-height: 330px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 11px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eaf2f9;
      color: var(--navy);
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    a {
      overflow-wrap: anywhere;
    }

    .demo {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 14px 0;
    }

    button {
      background: var(--blue);
      color: white;
      border: 0;
      padding: 10px 15px;
      margin: 5px 5px 5px 0;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: var(--navy);
    }

    input {
      padding: 10px;
      max-width: 100%;
      border: 1px solid #9aaabd;
      border-radius: 5px;
    }

    .result {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 24px;
      background: var(--navy);
      color: white;
    }

    @media (max-width: 600px) {
      article, .panel {
        padding: 18px;
      }

      header {
        padding: 28px 16px;
      }

      .chart {
        min-height: 280px;
      }
    }
